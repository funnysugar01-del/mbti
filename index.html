<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 뇌 속 회의실 | MBTI 성향 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:#f7f8fc;color:#20233a}.app{width:min(760px,calc(100% - 24px));margin:auto;padding:24px 0}.card{background:#fff;border:1px solid #e7e8f1;border-radius:26px;padding:34px;box-shadow:0 18px 48px rgba(52,45,120,.12)}.screen{display:none}.screen.active{display:block}.pill{display:inline-block;padding:8px 12px;border-radius:999px;background:#f0edff;color:#4e42bf;font-weight:800;margin-bottom:18px}h1{font-size:clamp(34px,8vw,58px);margin:0 0 14px}h1 span,.type{color:#6758e8}.lead{color:#6f738c;line-height:1.75}.stats,.meeting,.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:24px 0}.stats{grid-template-columns:repeat(3,1fr)}.stat,.meeting-box{padding:15px;border:1px solid #e7e8f1;border-radius:18px;background:#fafaff;text-align:center}.stat strong{display:block}.stat small,.meeting-box small{color:#6f738c}.btn{width:100%;border:0;border-radius:16px;padding:15px;min-height:54px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(135deg,#6758e8,#8a66f2);color:#fff}.btn-secondary{background:#f5f5fa;color:#20233a;border:1px solid #e7e8f1}.note,.quiz-foot{color:#888ca1;font-size:13px;text-align:center}.progress-head{display:flex;justify-content:space-between;margin-bottom:10px}.progress-title{font-weight:800;color:#4e42bf}.track{height:10px;background:#ececf3;border-radius:999px;overflow:hidden;margin-bottom:28px}.bar{height:100%;background:#6758e8}.qnum{padding:6px 10px;border-radius:999px;background:#f5f5fa;color:#6f738c;font-size:13px;font-weight:800}.question{min-height:128px;display:flex;align-items:center;font-size:clamp(22px,5vw,30px);line-height:1.5}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer{min-height:64px;padding:13px;border:1px solid #e7e8f1;border-radius:16px;background:#fff;font-weight:700;cursor:pointer;text-align:left}.answer.selected{background:#6758e8;color:#fff}.result-top{text-align:center}.character{width:min(250px,68vw);height:280px;margin:0 auto 18px;border-radius:24px}.type{font-size:clamp(44px,11vw,70px);font-weight:950}.role-title{font-size:28px}.tagline{color:#6f738c;line-height:1.7}.score-row{margin:18px 0}.score-head{display:flex;justify-content:space-between;font-weight:800}.score-track{height:13px;background:#ececf3;border-radius:999px;overflow:hidden}.score-left{height:100%;background:#6758e8}.close-note{padding:17px;border-radius:18px;background:#fff7ea;border:1px solid #ffe0ae}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#20233a;color:#fff;padding:11px 15px;border-radius:999px;opacity:0}.toast.show{opacity:1}@media(max-width:640px){.card{padding:22px 16px}.stats,.meeting,.actions,.answers{grid-template-columns:1fr}}
</style></head><body>
<main class="app">
<section id="start" class="screen active"><div class="card"><div class="pill">🧠 MBTI 성향 테스트</div><h1>내 뇌 속 <span>회의실</span></h1><p class="lead">16개의 상황에 답하면 E/I, S/N, T/F, J/P 성향을 계산하고, 당신의 뇌 속 회의실을 주도하는 멤버와 MBTI 유형을 보여드립니다.</p><div class="stats"><div class="stat"><strong>16문항</strong><small>한 문항씩 진행</small></div><div class="stat"><strong>4가지 축</strong><small>성향 비율 계산</small></div><div class="stat"><strong>16유형</strong><small>캐릭터 결과</small></div></div><button id="startBtn" class="btn btn-primary">회의 시작하기</button><p class="note">※ MBTI의 4가지 선호 지표를 참고한 성향 테스트이며 공식 MBTI 검사가 아닙니다.<br>답변은 서버로 전송하거나 저장하지 않습니다.</p></div></section>
<section id="quiz" class="screen"><div class="card"><div class="progress-head"><strong class="progress-title">🧠 뇌 속 회의 진행 중</strong><span id="count"></span></div><div class="track"><div id="bar" class="bar"></div></div><span id="qnum" class="qnum"></span><h2 id="question" class="question"></h2><div id="answers" class="answers"></div><div id="quizFoot" class="quiz-foot"></div></div></section>
<section id="result" class="screen"><div class="card"><div class="result-top"><div class="pill">📋 최종 회의 결과</div><div id="character" class="character"></div><div id="type" class="type"></div><h2 id="roleTitle" class="role-title"></h2><p id="tagline" class="tagline"></p></div><div class="meeting"><div class="meeting-box"><small>👑 오늘의 의장</small><br><strong id="chair"></strong></div><div class="meeting-box"><small>🥈 오늘의 부의장</small><br><strong id="vice"></strong></div></div><h3>성향 비율</h3><div id="scores"></div><div id="closeNote" class="close-note"></div><div class="actions"><button id="retryBtn" class="btn btn-secondary">🔄 다시 하기</button><button id="shareBtn" class="btn btn-primary">🔗 결과 공유하기</button></div></div></section>
</main><div id="toast" class="toast"></div>
<script>
const questions=[
{text:"처음 만난 사람들이 많은 자리에서도 비교적 먼저 말을 꺼내는 편이다.",key:"E"},{text:"중요한 결정을 할 때 현재 확인할 수 있는 사실과 실제 경험을 우선해서 본다.",key:"S"},{text:"의견 충돌이 생기면 상대의 기분보다 어떤 판단이 더 논리적인지를 먼저 생각한다.",key:"T"},{text:"여행이나 프로젝트를 시작하기 전에 전체 일정과 순서를 어느 정도 정해두는 편이다.",key:"J"},{text:"오랜 시간 사람들과 함께 있은 뒤에는 혼자 있는 시간이 있어야 다시 에너지가 생긴다.",key:"I"},{text:"설명을 들을 때 세부 절차보다 전체적인 의미와 앞으로의 가능성부터 파악하는 편이다.",key:"N"},{text:"누군가 고민을 이야기하면 해결책보다 먼저 그 사람이 어떤 기분일지 생각하는 편이다.",key:"F"},{text:"계획이 갑자기 바뀌어도 상황에 맞춰 다시 조정하는 것을 크게 부담스러워하지 않는다.",key:"P"},{text:"생각이 복잡할 때 혼자 정리하기보다 다른 사람과 이야기하면서 생각이 선명해지는 편이다.",key:"E"},{text:"새로운 아이디어를 들으면 실제로 가능한지 따지기 전에 먼저 흥미로운 가능성을 떠올린다.",key:"N"},{text:"팀에서 결정을 내려야 할 때 모두가 만족하는 것보다 기준이 일관되고 공정한지가 더 중요하다.",key:"T"},{text:"해야 할 일이 여러 개라면 우선순위와 마감 순서를 먼저 정리하는 편이다.",key:"J"},{text:"낯선 모임에서는 먼저 분위기를 관찰하고 익숙해진 뒤에 대화에 참여하는 편이다.",key:"I"},{text:"새로운 내용을 배울 때 추상적인 개념보다 구체적인 예시와 실제 사례가 있어야 이해가 잘 된다.",key:"S"},{text:"규칙에 맞는 결정이라도 누군가에게 큰 상처가 된다면 다시 생각해봐야 한다고 느낀다.",key:"F"},{text:"일을 하다가 더 좋은 방법이 보이면 기존 계획을 바꾸는 편이 자연스럽다.",key:"P"}];
const choices=[["전혀 아니다",1],["아니다",2],["약간 아니다",3],["약간 그렇다",4],["그렇다",5],["매우 그렇다",6]],opposite={E:"I",I:"E",S:"N",N:"S",T:"F",F:"T",J:"P",P:"J"};
const roles={E:"🎤 대외협력팀장",I:"🎧 독립연구원",S:"🔎 팩트체크팀장",N:"💡 미래전략팀장",T:"⚖️ 논리감사관",F:"❤️ 조직문화팀장",J:"📋 기획실장",P:"🎈 유연대응팀장"};
const types={INTJ:["♟️","전략기획 본부장","큰 그림을 그리고 논리적으로 구조화하는 전략가입니다."],INTP:["🔬","아이디어 연구소장","원리를 탐구하고 독창적인 해법을 찾습니다."],ENTJ:["🚀","성과전략 본부장","목표를 정하고 빠르게 결과를 만들어냅니다."],ENTP:["💡","혁신전략 본부장","기존 방식에 질문하며 새로운 가능성을 찾습니다."],INFJ:["🌙","비전설계 본부장","사람과 상황의 깊은 의미와 방향을 읽습니다."],INFP:["🌿","가치문화 기획자","가치와 가능성을 섬세하게 바라봅니다."],ENFJ:["🌟","조직성장 본부장","사람들의 장점을 발견하고 성장을 이끕니다."],ENFP:["🎈","신사업 아이디어 본부장","호기심과 상상력으로 새로운 가능성을 연결합니다."],ISTJ:["📋","운영관리 본부장","사실과 기준을 바탕으로 안정적으로 실행합니다."],ISFJ:["🤝","지원운영 본부장","주변의 필요를 세심하게 살피고 지원합니다."],ESTJ:["📊","실행관리 본부장","명확한 계획과 현실적인 판단으로 추진합니다."],ESFJ:["☕","조직문화 본부장","협력과 조화를 통해 좋은 분위기를 만듭니다."],ISTP:["🛠️","문제해결 엔지니어","상황을 분석하고 직접 해결책을 찾아냅니다."],ISFP:["🎨","감성경험 디자이너","감각과 가치에 충실하며 유연하게 적응합니다."],ESTP:["⚡","현장대응 본부장","빠르게 상황을 파악하고 행동으로 옮깁니다."],ESFP:["🎉","에너지운영 본부장","사람들과 어울리며 주변에 활기를 더합니다."]};
const $=id=>document.getElementById(id);let current=0,scores={};function reset(){scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};current=0}function show(id){["start","quiz","result"].forEach(x=>$(x).classList.toggle("active",x===id));scrollTo(0,0)}
function begin(){reset();show("quiz");render()}function render(){let q=questions[current];$("count").textContent=`${current+1} / 16`;$("qnum").textContent=`질문 ${current+1}`;$("question").textContent=q.text;$("bar").style.width=`${(current+1)/16*100}%`;$("quizFoot").textContent=current<4?"회의실 멤버들이 의견을 준비하고 있습니다.":current<8?"여러 멤버가 슬슬 목소리를 내기 시작합니다.":current<12?"회의실의 주도권 경쟁이 치열해지고 있습니다.":"의장 후보가 거의 좁혀졌습니다.";$("answers").innerHTML="";choices.forEach(([label,value])=>{let b=document.createElement("button");b.className="answer";b.textContent=label;b.onclick=()=>answer(q,value,b);$("answers").appendChild(b)})}
function answer(q,v,b){document.querySelectorAll(".answer").forEach(x=>x.disabled=true);b.classList.add("selected");scores[q.key]+=v;scores[opposite[q.key]]+=7-v;setTimeout(()=>{current++;current<16?render():finish()},300)}function pct(a,b){let t=scores[a]+scores[b],x=Math.round(scores[a]/t*100);return {[a]:x,[b]:100-x}}function win(a,b){return scores[a]>=scores[b]?a:b}
function finish(){let type=win("E","I")+win("S","N")+win("T","F")+win("J","P"),ps={EI:pct("E","I"),SN:pct("S","N"),TF:pct("T","F"),JP:pct("J","P")};renderResult(type,ps);show("result")}
function renderResult(type,p){let d=types[type];$("type").textContent=type;$("roleTitle").textContent=d[0]+" "+d[1];$("tagline").textContent=d[2];let c=$("character");c.style.background="linear-gradient(160deg,#eeeaff,#fff)";c.style.display="flex";c.style.alignItems="center";c.style.justifyContent="center";c.style.fontSize="90px";c.textContent=d[0];let gs=[{a:"E",b:"I",p:p.EI},{a:"S",b:"N",p:p.SN},{a:"T",b:"F",p:p.TF},{a:"J",b:"P",p:p.JP}];let leaders=gs.map(g=>({letter:g.p[g.a]>=g.p[g.b]?g.a:g.b,diff:Math.abs(g.p[g.a]-g.p[g.b])})).sort((a,b)=>b.diff-a.diff);$("chair").textContent=roles[leaders[0].letter];$("vice").textContent=roles[leaders[1].letter];$("scores").innerHTML=gs.map(g=>`<div class="score-row"><div class="score-head"><span>${g.a} ${g.p[g.a]}%</span><span>${g.b} ${g.p[g.b]}%</span></div><div class="score-track"><div class="score-left" style="width:${g.p[g.a]}%"></div></div></div>`).join("");let close=[...gs].sort((x,y)=>Math.abs(x.p[x.a]-x.p[x.b])-Math.abs(y.p[y.a]-y.p[y.b]))[0];$("closeNote").innerHTML=`<strong>⚡ 가장 치열했던 회의: ${close.a} ${close.p[close.a]}% vs ${close.b} ${close.p[close.b]}%</strong><p>두 성향의 차이가 작을수록 상황에 따라 양쪽 성향이 모두 나타날 수 있습니다.</p>`}
async function share(){const url="https://funnysugar01-del.github.io/mbti/";let ok=false;try{await navigator.clipboard.writeText(url);ok=true}catch(e){let t=document.createElement("textarea");t.value=url;document.body.appendChild(t);t.select();try{ok=document.execCommand("copy")}catch(_){}t.remove()}$("toast").textContent=ok?"테스트 공유 링크를 복사했습니다.":"주소 복사가 지원되지 않습니다.";$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1700)}
$("startBtn").onclick=begin;$("retryBtn").onclick=()=>show("start");$("shareBtn").onclick=share;
</script></body></html>
